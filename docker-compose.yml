services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onboardiq_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./onboardiq.db}
    volumes:
      - ./backend/onboardiq.db:/app/onboardiq.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - onboardiq_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onboardiq_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - onboardiq_network

networks:
  onboardiq_network:
    driver: bridge
