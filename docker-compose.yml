version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onboardiq_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/onboardiq.db:/app/onboardiq.db
    environment:
      - DATABASE_URL=sqlite:///./onboardiq.db
      - APP_ENV=production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onboardiq_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
